kotlin.code.style=official
kotlin.mpp.applyDefaultHierarchyTemplate=false

# On any given host only the native test task for that host can run (e.g. macosArm64Test on macOS).
# Without this, every build logs a warning for each target that cannot be tested here.
kotlin.native.ignoreDisabledTargets=true

# Linking four native targets exhausts the defaults (512m heap, 384m metaspace) and the daemon dies
# mid-build with "the JVM garbage collector is thrashing".
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
