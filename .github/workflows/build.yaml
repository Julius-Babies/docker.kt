name: Publish package to GitHub Packages
on:
  push:
    tags:
      - 'v*.*.*'
  # Runs the test job on demand, against any branch, without having to tag a release for it.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Integration tests wait on a daemon, so cap the run rather than let a hung one sit there.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        name: Checkout repository
      - uses: actions/setup-java@v5
        name: Setup Java
        with:
          java-version: '24'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # The linuxX64 target pulls in ktor-client-curl, so linking the test binary needs libcurl to
      # resolve -lcurl. The runner image carries it, but not as a guarantee worth a failed release.
      - name: Install libcurl
        run: sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      # Most specs talk to a real daemon. GitHub's ubuntu runners ship one, already running and
      # reachable by the runner user - fail loudly here rather than in a spec if that ever changes.
      - name: Check the Docker daemon is up
        run: docker version

      # allTests runs whatever the host can run: on this runner that is linuxX64Test, and the other
      # native targets are skipped rather than failing.
      - name: Run tests
        run: ./gradlew :docker-kt:allTests

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: docker-kt/build/reports/tests/
          retention-days: 7

  publish:
    # No release goes out on a red suite.
    needs: test
    # Only a tag releases. A manual run has no version to publish under - it would take the branch
    # name and push that to Maven Central.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        name: Checkout repository
      - uses: actions/setup-java@v5
        name: Setup Java
        with:
          java-version: '24'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Derive the release version
        id: release
        # Tags carry a leading v, Maven coordinates must not: v1.2.3 -> 1.2.3
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish package
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
          VERSION: ${{ steps.release.outputs.version }}
